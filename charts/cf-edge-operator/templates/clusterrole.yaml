apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-manager
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch]
- apiGroups: [saas.cf-edge.io]
  resources: [customhostnames]
  verbs: [get, list, patch, update, watch]
- apiGroups: [domains.cf-edge.io]
  resources: [zones]
  verbs: [get, list, watch]
- apiGroups: [saas.cf-edge.io]
  resources: [customhostnames/finalizers]
  verbs: [update]
- apiGroups: [domains.cf-edge.io]
  resources: [zones/finalizers]
  verbs: [update]
- apiGroups: [saas.cf-edge.io]
  resources: [customhostnames/status]
  verbs: [get, patch, update]
- apiGroups: [domains.cf-edge.io]
  resources: [zones/status]
  verbs: [get, patch, update]
{{- if .Values.controlPlane.enabled }}
# Load-balancing controllers (control-plane role only). Kept in sync with the
# +kubebuilder:rbac markers in internal/controller (config/rbac/role.yaml).
# secrets access is covered by the shared rule above.
- apiGroups: [loadbalancing.cf-edge.io]
  resources: [accounts]
  verbs: [get, list, patch, update, watch]
- apiGroups: [loadbalancing.cf-edge.io]
  resources: [loadbalancers, loadbalancerpools, loadbalancermonitors]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [loadbalancing.cf-edge.io]
  resources: [accounts/status, loadbalancers/status, loadbalancerpools/status, loadbalancermonitors/status]
  verbs: [get, patch, update]
- apiGroups: [loadbalancing.cf-edge.io]
  resources: [loadbalancers/finalizers, loadbalancerpools/finalizers, loadbalancermonitors/finalizers]
  verbs: [update]
{{- end }}
