apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-manager
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch]
- apiGroups: [cf.cf-edge.io]
  resources: [customhostnames, zones]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [cf.cf-edge.io]
  resources: [customhostnames/finalizers, zones/finalizers]
  verbs: [update]
- apiGroups: [cf.cf-edge.io]
  resources: [customhostnames/status, zones/status]
  verbs: [get, patch, update]
