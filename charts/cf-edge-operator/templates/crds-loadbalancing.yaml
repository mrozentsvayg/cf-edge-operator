{{- /*
Load-balancing CRDs are gated behind controlPlane.enabled so per-cluster
deployments never install them. They live in crds-optional/ (NOT the auto-
installed crds/ directory) and are emitted here verbatim via .Files.Get -- the
raw CRD YAML is not run through the template engine. Each file carries its own
leading "---" document separator, so none is added here.
Unlike crds/, these are part of the Helm release and upgrade/uninstall with it.
*/ -}}
{{- if .Values.controlPlane.enabled }}
{{- range $path, $_ := .Files.Glob "crds-optional/*.yaml" }}
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
