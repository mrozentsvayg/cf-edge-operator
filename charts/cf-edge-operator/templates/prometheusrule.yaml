{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cf-edge-operator.name" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: cf-edge-operator
    rules:
    {{- if or (eq (include "cf-edge-operator.customhostnameEnabled" .) "true") (eq (include "cf-edge-operator.loadBalancingEnabled" .) "true") }}

    # Fires when a Zone CR has never been initialized (zone GET to resolve zone name
    # has never succeeded). This only happens on fresh zones or after credentialsRef changes.
    - alert: CfEdgeOperatorZoneNotInitialized
      expr: cf_edge_operator_zone_initialized == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: >-
          Zone {{`{{ $labels.zone_cr }}`}} is not initialized
        description: >-
          The Zone CR {{`{{ $labels.zone_cr }}`}} has not been initialized for 10 minutes.
          The zone GET to resolve the zone name from Cloudflare has not succeeded.
          Check the credentials secret and Cloudflare API reachability.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorZoneNotInitialized
        {{- end }}
    {{- end }}

    # Fires when the operator metrics endpoint is unreachable. Custom hostname
    # management is fully suspended while the operator is down.
    - alert: CfEdgeOperatorDown
      expr: >-
        absent(up{job="cf-edge-operator"})
        or up{job="cf-edge-operator"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: cf-edge-operator is not running
        description: >-
          The operator metrics endpoint has been unreachable for 2 minutes.
          All Cloudflare reconciliation is suspended -- custom hostnames, and load
          balancing where the control-plane role is enabled.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorDown
        {{- end }}
    {{- if eq (include "cf-edge-operator.customhostnameEnabled" .) "true" }}

    # Fires when one or more CustomHostname CRs have consecutive reconcile failures.
    # The CR's status.consecutiveErrors field shows the failure count.
    - alert: CfEdgeOperatorUnhealthyHostnames
      expr: >-
        sum by (zone_cr) (cf_edge_operator_customhostnames{state="unhealthy"}) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: >-
          {{`{{ $value }}`}} unhealthy custom hostname(s) in zone {{`{{ $labels.zone_cr }}`}}
        description: >-
          One or more CustomHostname CRs in zone {{`{{ $labels.zone_cr }}`}} have consecutive
          reconcile failures (status.consecutiveErrors > 0, Ready=False). The operator is
          retrying with exponential backoff. Check operator logs for the specific hostnames.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorUnhealthyHostnames
        {{- end }}

    # Fires when two or more CRs claim the same Cloudflare hostname.
    # Only the first CR to create the hostname in Cloudflare is active; duplicate CRs
    # are marked HostnameConflict and are not reconciled until the conflict resolves.
    - alert: CfEdgeOperatorConflictHostnames
      expr: >-
        sum by (zone_cr) (cf_edge_operator_customhostnames{state="conflict"}) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: >-
          {{`{{ $value }}`}} conflicted custom hostname(s) in zone {{`{{ $labels.zone_cr }}`}}
        description: >-
          Two or more CustomHostname CRs in zone {{`{{ $labels.zone_cr }}`}} claim the same
          Cloudflare hostname. The duplicate CR(s) are inactive and marked HostnameConflict.
          Delete the duplicate CR to resolve. The conflict clears automatically on the next
          zone drift detection cycle after the owning CR is removed.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorConflictHostnames
        {{- end }}
    {{- end }}

    # Fires when the Cloudflare API returns sustained 5xx errors. 4xx errors (e.g., 409
    # conflict, 404 not found) are expected and are not counted here.
    - alert: CfEdgeOperatorHighAPIErrorRate
      expr: >-
        sum(rate(cf_edge_operator_api_errors_by_code_total{status_code=~"5.."}[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: >-
          Elevated Cloudflare API 5xx error rate ({{`{{ $value | humanize }}`}}/s)
        description: >-
          The operator is receiving sustained 5xx errors from the Cloudflare API (>6/min).
          This may indicate a Cloudflare service degradation or an API token problem.
          Check https://www.cloudflarestatus.com and the operator logs.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorHighAPIErrorRate
        {{- end }}
    {{- if eq (include "cf-edge-operator.customhostnameEnabled" .) "true" }}

    # Fires when hostnames remain in a non-ready state for over 24 hours. Cloudflare SSL
    # provisioning normally completes within minutes to a few hours.
    # Note: this alert may fire during large batch provisioning. Add a silence during
    # planned migrations.
    - alert: CfEdgeOperatorSSLProvisioningStalled
      expr: >-
        sum by (zone_cr) (cf_edge_operator_customhostnames{state="pending"}) > 0
      for: 24h
      labels:
        severity: warning
      annotations:
        summary: >-
          {{`{{ $value }}`}} hostname(s) pending SSL in zone {{`{{ $labels.zone_cr }}`}} for >24h
        description: >-
          At least one hostname in zone {{`{{ $labels.zone_cr }}`}} has been in a non-ready state
          for over 24 hours. Check status.ssl.validationRecords on the affected
          CustomHostname CR(s) to obtain DCV tokens and verify DNS/HTTP validation is
          correctly set up.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorSSLProvisioningStalled
        {{- end }}
    {{- end }}
    {{- if eq (include "cf-edge-operator.loadBalancingEnabled" .) "true" }}

    # Fires when an Account CR has never been initialized (credentials never
    # validated against the Cloudflare account). This only happens on fresh
    # accounts or after credentialsRef changes.
    - alert: CfEdgeOperatorAccountNotInitialized
      expr: cf_edge_operator_account_initialized == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: >-
          Account {{`{{ $labels.account_cr }}`}} is not initialized
        description: >-
          The Account CR {{`{{ $labels.account_cr }}`}} has not been initialized for 10 minutes.
          The credentials have not validated against the Cloudflare account.
          Check the credentials secret and Cloudflare API reachability.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorAccountNotInitialized
        {{- end }}

    # Fires when one or more LoadBalancer, LoadBalancerPool, or LoadBalancerMonitor
    # CRs have consecutive reconcile failures (Ready=False on a setError reason).
    # The CR's status.consecutiveErrors field shows the failure count.
    - alert: CfEdgeOperatorLoadBalancersError
      expr: >-
        (cf_edge_operator_loadbalancers{state="error"} > 0)
        or (cf_edge_operator_loadbalancerpools{state="error"} > 0)
        or (cf_edge_operator_loadbalancermonitors{state="error"} > 0)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: >-
          {{`{{ $value }}`}} {{`{{ $labels.__name__ }}`}} CR(s) in error state for owner {{`{{ $labels.zone_cr }}{{ $labels.account_cr }}`}}
        description: >-
          One or more {{`{{ $labels.__name__ }}`}} CRs for owner {{`{{ $labels.zone_cr }}{{ $labels.account_cr }}`}}
          have consecutive reconcile failures (status.consecutiveErrors > 0, Ready=False). The operator
          is retrying with exponential backoff. Check operator logs and the affected CR conditions.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorLoadBalancersError
        {{- end }}

    # Fires when LoadBalancer / LoadBalancerPool / LoadBalancerMonitor CRs stay in
    # the waiting state. Waiting folds in two cases: a soft wait on an unresolved
    # dependency (a dangling or misconfigured monitorRef or fallbackPoolRef whose
    # referenced CR is missing or has not provisioned in Cloudflare yet), and observe
    # mode (managementPolicy=observe), where the operator waits for the resource to
    # appear in Cloudflare instead of creating it (WaitingForExternal).
    - alert: CfEdgeOperatorLoadBalancersWaiting
      expr: >-
        (cf_edge_operator_loadbalancers{state="waiting"} > 0)
        or (cf_edge_operator_loadbalancerpools{state="waiting"} > 0)
        or (cf_edge_operator_loadbalancermonitors{state="waiting"} > 0)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          {{`{{ $value }}`}} waiting {{`{{ $labels.__name__ }}`}} CR(s) for owner {{`{{ $labels.zone_cr }}{{ $labels.account_cr }}`}}
        description: >-
          One or more {{`{{ $labels.__name__ }}`}} CRs for owner {{`{{ $labels.zone_cr }}{{ $labels.account_cr }}`}}
          have been in the waiting state for 30 minutes. Waiting folds in two cases: a soft wait on
          an unresolved dependency -- a dangling or misconfigured monitorRef or fallbackPoolRef whose
          referenced CR is missing or has not provisioned in Cloudflare -- and observe mode
          (managementPolicy=observe), where the operator waits for the resource to appear in Cloudflare
          instead of creating it. Check the referenced pool/monitor CRs exist and are Ready, or that the
          expected resource exists in Cloudflare if the CR is in observe mode.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorLoadBalancersWaiting
        {{- end }}

    # Fires when one or more LoadBalancer CRs are serving in a partial (degraded)
    # state -- at least one referenced pool is unresolved (a missing or
    # not-yet-ready Pool CR), so the LB serves with a reduced pool set. This is an
    # application/configuration problem (a dangling pool ref), like the waiting
    # alert, but the LB IS still serving, so it is low severity with a longer
    # window.
    - alert: CfEdgeOperatorLoadBalancersPartial
      expr: cf_edge_operator_loadbalancers{state="partial"} > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: >-
          {{`{{ $value }}`}} partial (degraded) LoadBalancer CR(s) for zone {{`{{ $labels.zone_cr }}`}}
        description: >-
          One or more LoadBalancer CRs for zone {{`{{ $labels.zone_cr }}`}} have been serving in a
          partial (degraded) state for 1 hour: some referenced pools are unresolved (a missing or
          not-yet-ready Pool CR), so the load balancer serves with a reduced pool set. Check
          status.unresolvedPoolRefs on the affected LoadBalancer CR(s) and ensure the referenced
          Pool CRs exist and are Ready.
        {{- if .Values.prometheusRule.runbookUrl }}
        runbook_url: {{ .Values.prometheusRule.runbookUrl }}/CfEdgeOperatorLoadBalancersPartial
        {{- end }}
    {{- end }}
{{- end }}
