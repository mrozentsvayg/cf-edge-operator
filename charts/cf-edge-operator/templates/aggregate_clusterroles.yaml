# Aggregate ClusterRoles for multi-tenant RBAC.
# These merge into Kubernetes' built-in admin/edit/view ClusterRoles
# so users with those roles automatically get appropriate CRD access.
{{- if eq (include "cf-edge-operator.customhostnameEnabled" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-customhostname-admin
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames"]
  verbs: ["*"]
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-customhostname-editor
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-customhostname-viewer
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["saas.cf-edge.io"]
  resources: ["customhostnames/status"]
  verbs: ["get"]
{{- end }}
{{- if or (eq (include "cf-edge-operator.customhostnameEnabled" .) "true") (eq (include "cf-edge-operator.loadBalancingEnabled" .) "true") }}
# Zone aggregate roles: shared substrate for both custom hostname management and
# load balancing, so they are present whenever either feature is enabled.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-zone-admin
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones"]
  verbs: ["*"]
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-zone-editor
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-zone-viewer
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["domains.cf-edge.io"]
  resources: ["zones/status"]
  verbs: ["get"]
{{- end }}
{{- if eq (include "cf-edge-operator.loadBalancingEnabled" .) "true" }}
# Load-balancing aggregate roles (control-plane role only), matching the
# customhostname/zone roles above for the loadbalancing.cf-edge.io CRs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-loadbalancing-admin
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts"]
  verbs: ["*"]
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts/status"]
  verbs: ["get"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers", "loadbalancerpools", "loadbalancermonitors"]
  verbs: ["*"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers/status", "loadbalancerpools/status", "loadbalancermonitors/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-loadbalancing-editor
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts/status"]
  verbs: ["get"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers", "loadbalancerpools", "loadbalancermonitors"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers/status", "loadbalancerpools/status", "loadbalancermonitors/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cf-edge-operator.name" . }}-loadbalancing-viewer
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["accounts.cf-edge.io"]
  resources: ["accounts/status"]
  verbs: ["get"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers", "loadbalancerpools", "loadbalancermonitors"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["loadbalancing.cf-edge.io"]
  resources: ["loadbalancers/status", "loadbalancerpools/status", "loadbalancermonitors/status"]
  verbs: ["get"]
{{- end }}
