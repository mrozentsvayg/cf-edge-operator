apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cf-edge-operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-edge-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cf-edge-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cf-edge-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cf-edge-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: manager
        image: {{ include "cf-edge-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        - --metrics-secure=false
        - --operator-namespace={{ include "cf-edge-operator.operatorNamespace" . }}
        - --management-policy={{ .Values.managementPolicy }}
        - --delete-policy={{ .Values.deletePolicy }}
        {{- if .Values.customhostnameManagementPolicy }}
        - --customhostname-management-policy={{ .Values.customhostnameManagementPolicy }}
        {{- end }}
        {{- if .Values.customhostnameDeletePolicy }}
        - --customhostname-delete-policy={{ .Values.customhostnameDeletePolicy }}
        {{- end }}
        {{- if .Values.loadbalancingManagementPolicy }}
        - --loadbalancing-management-policy={{ .Values.loadbalancingManagementPolicy }}
        {{- end }}
        {{- if .Values.loadbalancingDeletePolicy }}
        - --loadbalancing-delete-policy={{ .Values.loadbalancingDeletePolicy }}
        {{- end }}
        - --drift-interval={{ .Values.driftInterval }}
        - --drift-buffer={{ .Values.driftBuffer }}
        - --cf-api-timeout={{ .Values.cfAPITimeout }}
        - --cf-api-write-timeout={{ .Values.cfAPIWriteTimeout }}
        - --cf-api-max-retries={{ .Values.cfAPIMaxRetries }}
        - --cf-api-bulk-timeout={{ .Values.cfAPIBulkTimeout }}
        - --cf-api-bulk-max-retries={{ .Values.cfAPIBulkMaxRetries }}
        - --cf-api-write-delay={{ .Values.cfAPIWriteDelay }}
        {{- if ne (lower (toString .Values.dryRun)) "false" }}
        - --dry-run
        {{- end }}
        {{- /* Feature flags render as explicit --enable-*=<bool> via the string-safe
               helpers in _helpers.tpl, so a null or string "false" value never renders
               as --enable-*= (empty, which ParseBool rejects) and never slips through
               Helm's non-empty-string truthiness. --enable-pool-health is off unless
               load balancing is also on (see poolHealthEnabled). */}}
        - --enable-customhostname={{ include "cf-edge-operator.customhostnameEnabled" . }}
        - --enable-loadbalancing={{ include "cf-edge-operator.loadBalancingEnabled" . }}
        - --enable-pool-health={{ include "cf-edge-operator.poolHealthEnabled" . }}
        {{- if ne (lower (toString .Values.leaderElect)) "false" }}
        - --leader-elect
        {{- end }}
        {{- if .Values.sslCertificateAuthority }}
        - --ssl-certificate-authority={{ .Values.sslCertificateAuthority }}
        {{- end }}
        {{- if .Values.sslMinTLSVersion }}
        - --ssl-min-tls-version={{ .Values.sslMinTLSVersion }}
        {{- end }}
        {{- if .Values.sslMethod }}
        - --ssl-method={{ .Values.sslMethod }}
        {{- end }}
        {{- if .Values.sslType }}
        - --ssl-type={{ .Values.sslType }}
        {{- end }}
        - --zap-devel={{ .Values.zapDevel }}
        {{- if .Values.zapLogLevel }}
        - --zap-log-level={{ .Values.zapLogLevel }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
