image:
  repository: ghcr.io/mrozentsvayg/cf-edge-operator
  tag: ""  # defaults to chart appVersion; use without v prefix (v0.3.4 tag -> 0.3.4 image)
  pullPolicy: IfNotPresent

# List of image pull secret names for pulling from private registries.
# Example: imagePullSecrets: ["ghcr-pull-secret"]
imagePullSecrets: []

# Additional labels to add to the pod template.
podLabels: {}

replicaCount: 1

# Enable leader election (required when running multiple replicas)
leaderElect: true

# Namespace where Zone CRs are managed.
# Defaults to the release namespace if left empty.
operatorNamespace: ""

# Default management policy for all managed resources (CustomHostname and load-balancing CRs).
# "manage": full lifecycle -- create, update, delete (default).
# "create": provision if missing, never update (safe coexistence with external-dns).
# "observe": read-only tracking, no Cloudflare writes.
# Per-CR spec.managementPolicy overrides this default.
managementPolicy: "manage"

# Delete policy for all managed resources (CustomHostname and load-balancing CRs).
# "always": delete from Cloudflare by ID regardless (default).
# "own-only": only delete if the current Cloudflare ID matches status.id.
# "never": release the finalizer without deleting from Cloudflare.
# Per-CR spec.deletePolicy overrides this default.
deletePolicy: "always"

# Per-feature policy overrides. Precedence (highest first): per-CR spec > per-feature
# flag (below) > global managementPolicy/deletePolicy (above) > built-in default.
# Use these to run one feature under a different default than the other -- e.g.
# CustomHostname in "create" (coexist with external-dns) while load balancing enforces
# single-owner "manage".
#
# CustomHostname feature. Empty inherits the global managementPolicy / deletePolicy.
customhostnameManagementPolicy: ""
customhostnameDeletePolicy: ""
# Load-balancing feature. The operator flag inherits the global managementPolicy when
# empty (like the other three); this chart sets "manage" as the single-owner deployment
# default -- the opinion lives here, not baked into the binary. Set "" to inherit the
# global managementPolicy instead. deletePolicy empty inherits the global deletePolicy.
loadbalancingManagementPolicy: "manage"
loadbalancingDeletePolicy: ""

# Dry-run mode: log what would happen without writing to Cloudflare.
dryRun: false

# CRD lifecycle. All CRDs (CustomHostname, Zone, and the load-balancing set) are
# chart-rendered and gated per feature (see features below), so CRD management is
# symmetric across features. Mirrors cert-manager's crds.enabled/crds.keep model.
crds:
  # Let the chart install and manage the CRDs. Set false to manage them out-of-band
  # (a cluster admin applies config/crd separately); the chart then emits no CRDs.
  enabled: true
  # Stamp helm.sh/resource-policy:keep and argocd.argoproj.io/sync-options:Prune=false
  # onto every CRD so `helm uninstall` and GitOps prune never delete them. Deleting a
  # CRD cascade-deletes every CR it defines, so keep=true is the safe default: the CRDs
  # survive an uninstall and must be removed explicitly (kubectl delete crd ...).
  keep: true

# Feature gates. Each feature is enabled independently; the operator runs only the
# controllers, RBAC, and metric series for the features that are enabled. The Zone
# controller is shared substrate (credential/zone-identity validation) and runs
# whenever either feature below is enabled.
features:
  # Custom hostname management: the CustomHostname controller plus the shared Zone
  # controller. Enabled by default -- this preserves the operator's original behavior.
  customhostname:
    enabled: true
  # Load balancing: the Account, LoadBalancer, LoadBalancerPool, and
  # LoadBalancerMonitor controllers. This is a single-owner control-plane role --
  # exactly one cluster (the control cluster) should set this true; all others leave
  # it false. When false, the load-balancing CRDs, RBAC, controllers, and metric
  # series are all omitted; the deployment still passes an explicit
  # --enable-loadbalancing=false flag but starts none of the load-balancing
  # machinery, so a non-control cluster carries no load-balancing footprint.
  loadBalancing:
    enabled: false
    # Opt-in pool-health axis (--enable-pool-health). When true, each
    # LoadBalancerPool reconcile makes one extra Cloudflare read (PoolHealth.Get)
    # and publishes the loadbalancerpool health gauges (region/origin health).
    # Off by default: the poll and its metric series add cost only when enabled.
    # Ignored unless loadBalancing.enabled is also true. Cardinality note: adds
    # per-pool and per-origin series always, plus per-region and per-origin-per-
    # region series for pools that set spec.checkRegions (bounded to <=13 regions);
    # pools without checkRegions get only the summarized per-pool/per-origin series.
    # See docs for the full cardinality and same-address caveats.
    poolHealth: false

# How often the zone controller bulk-lists Cloudflare custom hostnames to detect
# external drift (manual dashboard changes, other automation), and how often the
# load-balancing controllers (Account/LoadBalancer/LoadBalancerPool/LoadBalancerMonitor)
# self-requeue to re-check external drift and retry transient errors. Lower values
# reduce the window in which external changes go undetected.
driftInterval: "1m"

# Buffer size of the internal channel used to enqueue drifted CustomHostname CRs.
# Specific to custom hostname drift detection; the load-balancing controllers self-requeue
# and do not use this channel. The zone controller sends at most one event per drifted CR
# per cycle; increase if running many zones with large numbers of custom hostnames.
driftBuffer: 1024

# Per-request timeout for CF API read calls (zone lookup, CH get/findByHostname).
cfAPITimeout: "5s"

# Per-request timeout for CF API write calls (CH create/update/delete).
# Longer than read timeout to accommodate CF processing during degradation.
cfAPIWriteTimeout: "15s"

# Maximum retries for single CF API calls (immediate, no backoff).
# Does not apply to paginated bulk list (see cfAPIBulkMaxRetries).
# Skips retry on 429 (rate limit).
cfAPIMaxRetries: 1

# Per-page timeout for paginated CF API calls (bulk drift list).
cfAPIBulkTimeout: "5s"

# Maximum per-page retries for paginated CF API calls (SDK-level, ~2s backoff).
# Only the failed page is retried, not the whole list.
cfAPIBulkMaxRetries: 0

# Pause after each successful CF write operation (create/edit/delete).
# Paces sequential writes to avoid triggering CF API throttling during bulk changes.
cfAPIWriteDelay: "250ms"

# Default SSL settings for new custom hostnames. Applied on create when the
# CR's spec.ssl field is empty. CA/minTLS: empty = CF default. Method: empty = http. Type: empty = dv.
sslCertificateAuthority: ""
sslMinTLSVersion: ""
sslMethod: ""
sslType: ""

# Development mode logger: human-readable console output, DPanic panics.
# Set to false for production JSON logs suitable for log aggregation.
zapDevel: true

# Log verbosity level.
# 0 = INFO only, 1 = DEBUG/debug (confirmations, heartbeats), 2 = TRACE/trace (per-item orphans, dry-run details).
# In development mode (zapDevel=true), V(1)/DEBUG is visible by default; V(2)/TRACE requires --zap-log-level=2.
# In production mode (zapDevel=false), only INFO is visible by default.
zapLogLevel: ""

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

serviceAccount:
  # Defaults to the release name if left empty.
  name: ""

# PodDisruptionBudget ensures at least one replica remains available during
# voluntary disruptions (node drains, rolling updates). Requires replicaCount > 1
# to have any effect.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ServiceMonitor for Prometheus Operator. Requires prometheus-operator to be installed.
# The ServiceMonitor targets the metrics Service created by this chart (port 8080).
# Sets job="cf-edge-operator" on scraped series via the app.kubernetes.io/name label.
serviceMonitor:
  enabled: false
  # Namespace for the ServiceMonitor. Defaults to the release namespace.
  namespace: ""
  # Scrape interval.
  interval: "30s"
  # Additional labels to add to the ServiceMonitor (e.g., to match a Prometheus selector).
  additionalLabels: {}

# PrometheusRule with alert definitions. Requires prometheus-operator to be installed.
# Alert expressions use job="cf-edge-operator", matching the ServiceMonitor above.
prometheusRule:
  enabled: false
  # Namespace for the PrometheusRule. Defaults to the release namespace.
  namespace: ""
  # Additional labels (e.g., to match a Prometheus ruleSelector).
  additionalLabels: {}
  # Base URL for runbook links appended to alert annotations.
  # Example: "https://wiki.example.com/runbooks/cf-edge-operator"
  # Leave empty to omit runbook_url annotations.
  runbookUrl: ""
