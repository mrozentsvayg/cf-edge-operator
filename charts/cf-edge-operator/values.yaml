image:
  repository: ghcr.io/mrozentsvayg/cf-edge-operator
  tag: ""  # defaults to chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# Enable leader election (required when running multiple replicas)
leaderElect: true

# Namespace where Zone CRs are managed.
# Defaults to the release namespace if left empty.
operatorNamespace: ""

# Delete policy for CustomHostname CRs.
# "always": delete from Cloudflare by ID regardless (default).
# "own-only": only delete if the current Cloudflare ID matches status.id.
deletePolicy: "always"

# Dry-run mode: log what would happen without writing to Cloudflare.
dryRun: false

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

serviceAccount:
  # Defaults to the release name if left empty.
  name: ""

# PodDisruptionBudget ensures at least one replica remains available during
# voluntary disruptions (node drains, rolling updates). Requires replicaCount > 1
# to have any effect.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
