---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: accounts.loadbalancing.cf-edge.io
spec:
  group: loadbalancing.cf-edge.io
  names:
    kind: Account
    listKind: AccountList
    plural: accounts
    singular: account
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.id
      name: Account ID
      type: string
    - jsonPath: .status.name
      name: Account
      type: string
    - jsonPath: .status.conditions[?(@.type=="Initialized")].status
      name: Initialized
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Account is the Schema for the accounts API. It supplies the Cloudflare
          account ID and credentials for account-scoped Load Balancing resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AccountSpec defines the desired state of an Account.

              An Account carries the Cloudflare account ID and API credentials used by
              account-scoped resources (LoadBalancerPool, LoadBalancerMonitor). It is the
              account-scope analog of a Zone: account-scoped resources reference an Account
              via AccountRef, the same way zone-scoped resources reference a Zone.
            properties:
              credentialsRef:
                description: |-
                  CredentialsRef references the secret containing the Cloudflare API token.
                  The token needs account-scoped Load Balancing permissions. The secret
                  must be in the same namespace as the Account resource.
                properties:
                  key:
                    default: apiToken
                    description: Key within the secret containing the API token.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
              id:
                description: |-
                  ID is the Cloudflare account ID (32-character hex string).
                  Immutable -- changing it would repoint all referencing resources at a
                  different Cloudflare account.
                pattern: ^[0-9a-f]{32}$
                type: string
                x-kubernetes-validations:
                - message: account ID is immutable
                  rule: self == oldSelf
            required:
            - credentialsRef
            - id
            type: object
          status:
            description: |-
              AccountStatus defines the observed state of an Account.
              NOTE: No top-level ObservedGeneration -- it's set per-condition.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              name:
                description: Name is the Cloudflare account name, populated from the
                  API on init.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
