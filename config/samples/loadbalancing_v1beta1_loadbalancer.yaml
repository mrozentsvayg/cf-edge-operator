apiVersion: loadbalancing.cf-edge.io/v1beta1
kind: LoadBalancer
metadata:
  # CR name is a k8s identifier only; the CF-side LB is named after
  # spec.hostname (which is also the DNS record).
  name: web-global
  namespace: default
spec:
  zoneRef:
    name: example-com
  hostname: lb.example.com

  # Single-owner model: the LoadBalancer and every LoadBalancerPool it
  # references are managed by one (control-cluster) operator, so each pool ref
  # resolves from a local LoadBalancerPool CR (by name -> that CR's status.id).
  # A default-pool entry may carry an optional per-LB weight, used only under a
  # weighted steering policy (random / least_outstanding_requests /
  # least_connections). The weight lives on the reference, not on the pool CR,
  # so the same pool can carry different weights in different LoadBalancers.
  defaultPoolRefs:
    - name: web-us-pool
      weight: "0.7"
    - name: web-apac-pool
      weight: "0.3"
  fallbackPoolRef:
    name: web-us-pool

  # random: CF distributes traffic across the default pools in proportion to
  # their weights (a pool without a weight uses spec.defaultWeight below, or
  # Cloudflare's default of 1). steeringPolicy defaults to "off" (ordered
  # failover, no weights) -- the only policy available without Cloudflare's
  # traffic-steering add-on; set an advanced policy explicitly when entitled.
  steeringPolicy: random
  # defaultWeight: "1"   # weight for default pools without an explicit weight

  # Resolution is best-effort: a pool ref whose CR is absent or not yet ready
  # is dropped and surfaced on the Ready condition (the LB->Pool watch re-drives
  # as pools become ready). Cloudflare still requires a resolvable fallback pool
  # plus at least one default pool before the LB is written.

  # proxied: true    # CF proxy on; required for most LB features
  # ttl:             # DNS TTL for non-proxied LBs only
