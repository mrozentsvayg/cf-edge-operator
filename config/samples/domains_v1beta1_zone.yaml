apiVersion: domains.cf-edge.io/v1beta1
kind: Zone
metadata:
  name: example-com
  namespace: cf-edge-operator-system
spec:
  id: "0123456789abcdef0123456789abcdef"  # replace with your Cloudflare zone ID
  credentialsRef:
    name: cloudflare-api-token
    key: apiToken
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cf-edge-operator-system
stringData:
  apiToken: "<your-cloudflare-api-token>"
