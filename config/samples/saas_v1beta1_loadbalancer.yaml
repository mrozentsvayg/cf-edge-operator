apiVersion: saas.cf-edge.io/v1beta1
kind: LoadBalancer
metadata:
  # CR name is a k8s identifier only; the CF-side LB is named after
  # spec.hostname (which is also the DNS record).
  name: web-global
  namespace: default
spec:
  zoneRef:
    name: example-com
  hostname: lb.example.com

  # Multi-region pattern: each region's cluster owns its own
  # LoadBalancerPool CR (see saas_v1beta1_loadbalancerpool.yaml). The
  # parent region additionally owns THIS LoadBalancer, which references
  # peer-region pools by their deterministic CF-side name.
  #
  # Reference-resolution order per pool ref:
  #   1) Look up a local LoadBalancerPool CR in the same cluster.
  #   2) If not present locally, fall back to a CF-account pool-list
  #      lookup (matches by name).
  # Peer-cluster pools land via (2); same-cluster pools land via (1).
  defaultPoolRefs:
    - name: web-us-pool
    - name: web-apac-pool
  fallbackPoolRef:
    name: web-us-pool

  # dynamic_latency: CF picks the pool with lowest observed RTT from the
  # client's PoP. Requires health checks on origins (via the pools'
  # monitorRef). Fails over automatically to the next pool in the list
  # when the closest one goes unhealthy.
  steeringPolicy: dynamic_latency

  # Partial resolution: bring up the LB even if not every peer pool has
  # appeared in CF yet, as long as at least this many resolve. Missing
  # pools are added on subsequent reconciles. Omit for fail-hard mode
  # (LB reconcile requeues until all pool refs resolve).
  minimumPools: 1

  # proxied: true    # CF proxy on; required for most LB features
  # ttl:             # DNS TTL for non-proxied LBs only
