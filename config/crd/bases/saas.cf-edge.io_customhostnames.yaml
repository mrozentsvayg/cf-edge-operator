---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: customhostnames.saas.cf-edge.io
spec:
  group: saas.cf-edge.io
  names:
    kind: CustomHostname
    listKind: CustomHostnameList
    plural: customhostnames
    singular: customhostname
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hostname
      name: Hostname
      type: string
    - jsonPath: .spec.originServer
      name: Origin
      type: string
    - jsonPath: .status.ssl.status
      name: SSL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.createCount
      name: Creates
      type: integer
    - jsonPath: .status.consecutiveErrors
      name: Errors
      type: integer
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: CustomHostname is the Schema for the customhostnames API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CustomHostnameSpec defines the desired state of CustomHostname
            properties:
              deletePolicy:
                description: |-
                  DeletePolicy overrides the operator-wide --delete-policy for this CR.
                  "always" deletes from Cloudflare unconditionally; "own-only" skips deletion if the
                  current CF hostname ID differs from status.id (safe during migrations from other tools);
                  "never" releases the finalizer without deleting from Cloudflare.
                  Ignored when managementPolicy is "observe".
                  If not set, the operator-wide default applies.
                enum:
                - always
                - own-only
                - never
                type: string
              hostname:
                description: |-
                  Hostname is the custom hostname to register with Cloudflare (e.g. customer.example.com).
                  Immutable after creation — changing it would orphan the existing CF custom hostname.
                format: hostname
                type: string
                x-kubernetes-validations:
                - message: hostname is immutable
                  rule: self == oldSelf
              managementPolicy:
                description: |-
                  ManagementPolicy overrides the operator-wide --management-policy for this CR.
                  "manage": full lifecycle — create, update (drift correction), and delete per deletePolicy.
                  "create": provisions the hostname if missing, but never updates it (safe coexistence with
                  other tools like external-dns that may also modify the hostname). Deletes per deletePolicy.
                  "observe": read-only — tracks an externally-managed hostname without creating, updating,
                  or deleting it. deletePolicy is ignored; the finalizer is always released on CR deletion.
                  If not set, the operator-wide default applies.
                enum:
                - manage
                - create
                - observe
                type: string
              originSNI:
                description: |-
                  OriginSNI overrides the SNI sent to the origin during TLS handshake.
                  If omitted, the operator does not manage Origin SNI — Cloudflare uses its
                  default (the origin server hostname) and external changes are not corrected.
                  When set, the operator enforces the value on every reconcile.
                  Set to ":request_host_header:" to forward the incoming Host header as SNI.
                  Requires a Cloudflare account entitlement — contact your Cloudflare account team to enable.
                minLength: 1
                type: string
              originServer:
                description: OriginServer is the origin the custom hostname points
                  to (e.g. origin.internal.example.com)
                format: hostname
                type: string
              ssl:
                description: SSL configures the SSL/TLS certificate settings for this
                  custom hostname.
                properties:
                  certificateAuthority:
                    description: |-
                      CertificateAuthority sets the CA for the certificate.
                      Requires an enterprise plan. Omit if not applicable.
                    enum:
                    - lets_encrypt
                    - google
                    - ssl_com
                    type: string
                  method:
                    description: |-
                      Method of DCV (Domain Control Validation).
                      Empty = use --ssl-method operator default, then http.
                    enum:
                    - http
                    - txt
                    - email
                    type: string
                  minTLSVersion:
                    description: MinTLSVersion sets the minimum TLS version for this
                      hostname.
                    enum:
                    - "1.0"
                    - "1.1"
                    - "1.2"
                    - "1.3"
                    type: string
                  type:
                    description: |-
                      Type of SSL validation.
                      Empty = use --ssl-type operator default, then dv.
                    enum:
                    - dv
                    type: string
                type: object
              zoneRef:
                description: |-
                  ZoneRef references the Zone resource that owns this custom hostname.
                  The Zone must exist in the operator namespace.
                properties:
                  name:
                    description: Name of the Zone resource
                    type: string
                  namespace:
                    description: Namespace of the Zone resource. Defaults to the operator
                      namespace if omitted.
                    type: string
                required:
                - name
                type: object
            required:
            - hostname
            - originServer
            - zoneRef
            type: object
          status:
            description: CustomHostnameStatus defines the observed state of CustomHostname
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveErrors:
                description: |-
                  ConsecutiveErrors is the number of consecutive reconcile failures.
                  Resets to 0 on the next successful reconcile.
                format: int32
                type: integer
              createCount:
                description: |-
                  CreateCount tracks how many times this hostname has been (re)created in Cloudflare.
                  A value greater than 1 indicates external deletions occurred (e.g. via CF dashboard).
                format: int32
                type: integer
              id:
                description: ID is the Cloudflare-assigned custom hostname ID, used
                  for updates and deletes
                type: string
              ssl:
                description: SSL reflects the current SSL certificate state as reported
                  by Cloudflare
                properties:
                  bundleMethod:
                    description: BundleMethod is the certificate chain bundling method
                      (ubiquitous, optimal, force)
                    type: string
                  certificateAuthority:
                    description: CertificateAuthority is the CA that issued this certificate
                      (lets_encrypt, google, ssl_com)
                    type: string
                  expiresOn:
                    description: ExpiresOn is the certificate expiration time
                    format: date-time
                    type: string
                  hosts:
                    description: Hosts lists the hostnames covered by this certificate
                    items:
                      type: string
                    type: array
                  id:
                    description: ID is the Cloudflare SSL certificate identifier.
                      Changes on reissue.
                    type: string
                  issuer:
                    description: Issuer is the certificate issuer (e.g. "Google Trust
                      Services LLC")
                    type: string
                  method:
                    description: Method is the DCV method used for this certificate
                      (http, txt, email)
                    type: string
                  minTLSVersion:
                    description: MinTLSVersion is the minimum TLS version configured
                      for this hostname
                    type: string
                  serialNumber:
                    description: SerialNumber is the certificate serial number. Changes
                      on reissue.
                    type: string
                  status:
                    description: Status is the certificate verification state (e.g.
                      pending_validation, active, expired)
                    type: string
                  type:
                    description: Type is the validation type (dv)
                    type: string
                  uploadedOn:
                    description: UploadedOn is the time the certificate was issued/uploaded
                    format: date-time
                    type: string
                  validationErrors:
                    description: ValidationErrors contains any errors encountered
                      during SSL validation
                    items:
                      type: string
                    type: array
                  validationRecords:
                    description: |-
                      ValidationRecords contains the DCV tokens Cloudflare requires to complete SSL issuance.
                      The customer must satisfy these before SSL becomes active.
                    items:
                      description: SSLValidationRecord mirrors the Cloudflare API
                        ssl.validation_records entry
                      properties:
                        emails:
                          description: Emails lists contact addresses used for email-based
                            validation (email method)
                          items:
                            type: string
                          type: array
                        httpBody:
                          description: HTTPBody is the content that must be served
                            at HTTPUrl (http method)
                          type: string
                        httpUrl:
                          description: HTTPUrl is the URL where the token must be
                            served (http method)
                          type: string
                        txtName:
                          description: TXTName is the DNS TXT record name the customer
                            must create (txt method)
                          type: string
                        txtValue:
                          description: TXTValue is the value of the DNS TXT record
                            (txt method)
                          type: string
                      type: object
                    type: array
                  wildcard:
                    description: Wildcard indicates whether the certificate covers
                      a wildcard hostname
                    type: boolean
                type: object
              sslProvisioningStartedAt:
                description: |-
                  SSLProvisioningStartedAt records when the hostname was created (or recreated) in Cloudflare.
                  Used to measure SSL provisioning duration (time until ssl.status == active).
                  Reset on each recreation so it always reflects the most recent provisioning cycle.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
