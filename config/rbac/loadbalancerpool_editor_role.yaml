# This rule is not used by the project cf-edge-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within loadbalancing.cf-edge.io loadbalancerpools.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cf-edge-operator
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: loadbalancerpool-editor-role
rules:
- apiGroups:
  - loadbalancing.cf-edge.io
  resources:
  - loadbalancerpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - loadbalancing.cf-edge.io
  resources:
  - loadbalancerpools/status
  verbs:
  - get
