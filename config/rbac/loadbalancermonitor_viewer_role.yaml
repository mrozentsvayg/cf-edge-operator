# This rule is not used by the project cf-edge-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to loadbalancing.cf-edge.io loadbalancermonitors.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cf-edge-operator
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: loadbalancermonitor-viewer-role
rules:
- apiGroups:
  - loadbalancing.cf-edge.io
  resources:
  - loadbalancermonitors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - loadbalancing.cf-edge.io
  resources:
  - loadbalancermonitors/status
  verbs:
  - get
