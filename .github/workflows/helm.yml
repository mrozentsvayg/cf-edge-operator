name: Helm

on:
  push:
  pull_request:

jobs:
  helm-validate:
    name: Lint and validate chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Single source of truth shared with local `make helm-verify` (test/helm-verify.sh)
      # so local == CI: helm lint, all-features render smokes, flag-rendering assertions,
      # CRD-lifecycle (crds.enabled / crds.keep / per-feature gating) assertions, and the
      # chart-CRDs-match-generated-CRDs diff.
      - name: Verify chart (make helm-verify)
        run: make helm-verify
